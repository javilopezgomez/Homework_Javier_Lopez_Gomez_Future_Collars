<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Accounting system and warehouse management</title>
        <meta name="description" content="">
        <meta name="author" content="">
        <meta name="viewport" content="width=device-width, initial-scale = 1">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
    </head>

    <body>
    <div class="container grid-lg">
        <h1 class="text-center">Accounting system and warehouse management</h1>

        <div class="columns">
            <div class="column col-6">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title h4" style="text-align:center">Current Stock</div>
                    </div>
                    <div class="card-body">
                        <table class="table table-responsive">
                            <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>Bananas</td>
                                <td>50</td>
                            </tr>
                            <tr>
                                <td>Apples</td>
                                <td>100</td>
                            </tr>
                            <tr>
                                <td>Pears</td>
                                <td>100</td>
                            </tr>
                            <tr>
                                <td>Oranges</td>
                                <td>150</td>
                            </tr>
                            <tr>
                                <td>Watermelons</td>
                                <td>25</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="column col-6">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title h4" style="text-align:center">Account Balance</div>
                    </div>
                    <div class="card-body" style="text-align:center">
                        10.000€
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center" style="margin-top: 40px">
            <a href="purchase.html" class="btn btn-primary">Purchase</a>
            <a href="sale.html" class="btn btn-primary">Sale</a>
            <a href="balance.html" class="btn btn-warning">Change Balance</a>
            <a href="history.html" class="btn btn-link">History</a>
        </div>

</div>
</body>
</html>
