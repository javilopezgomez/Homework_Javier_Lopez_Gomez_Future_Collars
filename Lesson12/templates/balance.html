<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change balance</title>
        <meta name="viewport" content="width=device-width, initial-scale = 1">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
        <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
</head>
<body>
    <div class="container grid-lg">
        <h1 class="text-center">Introduce the balance data</h1>

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="operation">Operation</label>
                <select class="form-select" id="operation" name="operation" required>
                    <option value="add">Add</option>
                    <option value="subtract">Subtract</option>
                </select>

                <label class="form-label" for="amount">Amount</label>
                <input class="form-input" id="amount" name="amount" type="number" step="0.01" min="1" required>
            </div>

            <br>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

</body>
</html>
